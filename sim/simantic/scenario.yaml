# GENERATED by gen_scenario.py from design.py (the PCB netlist). Do not edit by hand.
# Every bus, chip-select and address below is derived from the board's nets.
machines:
  fc:
    mcu: STM32H743VI
    elf: ../../../PX4-Autopilot/build/dvntekim_fch743_default/dvntekim_fch743_default.elf
    parts:
      - { name: card, type: sd-card, bus: sdmmc2, size: 16MiB, image: card.img }
      - { name: imu0, type: spi-device, bus: spi1, cs: PC13, script: peers/icm45686_peer.py }
      - { name: acc1, type: spi-device, bus: spi2, cs: PC15, script: peers/bmi088_accel_peer.py }
      - { name: gyr1, type: spi-device, bus: spi2, cs: PC14, script: peers/bmi088_gyro_peer.py }
      - { name: baro, type: i2c-device, bus: i2c4, address: 0x47, script: peers/bmp581_peer.py }
      - { name: flow, type: can-node, script: peers/dronecan_nodestatus_peer.py }
media:
  - type: can
    connect: [fc.fdcan1, fc.flow]
timeout: 20
expect:
  - "NuttShell"
  - "icm45686 #0 on SPI bus 1"
  - "bmi088"
  - "bmp581 #0 on I2C bus 4 address 0x47"
  - "logger started"
expect_absent:
  - "HardFault"
  - "PANIC"
